# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: joffeego/joffeego.github.io
  branch: main
  auth_methods: [token]
  commit_messages:
    create: '📝 发布文章「{{slug}}」'
    update: '✏️ 更新文章「{{slug}}」'
    delete: '🗑️ 删除文章「{{slug}}」'
    uploadMedia: '🖼️ 上传图片 {{path}}'
    deleteMedia: '🗑️ 删除图片 {{path}}'

site_url: https://joffee.eu.org
logo_url: /images/avatar.jpg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: 博客文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}} — {{date}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - label: 草稿
        field: draft
        pattern: true
    fields:
      - label: 标题
        name: title
        widget: string
        pattern: ['^.{2,80}$', '标题长度需在 2-80 个字符之间']
      - label: 封面图
        name: cover
        widget: image
        required: false
        hint: 文章封面，建议尺寸 1200×630
        media_library:
          config:
            max_file_size: 5242880
      - label: 发布日期
        name: date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - label: 摘要
        name: description
        widget: string
        required: false
        hint: 留空则自动截取正文开头作为摘要
      - label: 分类
        name: categories
        widget: select
        multiple: true
        required: false
        options:
          - 技术
          - 生活
          - 随笔
          - 教程
          - 项目
          - 工具
      - label: 标签
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - ADB
          - Android
          - Astro
          - JavaScript
          - CSS
          - 前端
          - 后端
          - Linux
          - Git
          - 效率
          - 开发工具
          - 随手记
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 勾选后文章不会发布到线上
      - label: 正文
        name: body
        widget: markdown
